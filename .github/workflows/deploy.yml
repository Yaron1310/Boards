name: Deploy

# Deploys the whole Firebase project (functions, hosting, Firestore and Storage rules) whenever
# something lands on main — normally a merged pull request. Can also be started by hand from the
# Actions tab ("Run workflow").
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never run two deploys at once; a newer merge waits for the running deploy instead of racing it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      # Must match "runtime" in firebase.json, so the build here matches what runs in production.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # The frontend's Firebase config is read at build time from frontend/.env.production.
      # These values end up in the public JavaScript bundle anyway, so they're kept as
      # repository *variables* (Settings → Secrets and variables → Actions → Variables).
      - name: Write frontend build config
        working-directory: frontend
        run: |
          cat > .env.production <<EOF
          VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID=${{ vars.VITE_FIREBASE_DATABASE_ID }}
          VITE_RECAPTCHA_SITE_KEY=${{ vars.VITE_RECAPTCHA_SITE_KEY }}
          EOF
          missing=$(grep -E '^VITE_FIREBASE_(API_KEY|PROJECT_ID|APP_ID)=$' .env.production || true)
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables for the frontend build: $missing"
            exit 1
          fi

      # A service account key for the gymind-p project, stored as the FIREBASE_SERVICE_ACCOUNT
      # repository secret (the whole JSON file's contents).
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Uses the project's own pinned firebase-tools (backend devDependency), so CI deploys with
      # the same CLI version as a local `npx firebase`. firebase.json's predeploy hooks build the
      # backend and the frontend (and retain the previous deploy's assets) before uploading.
      - name: Deploy
        run: ./backend/node_modules/.bin/firebase deploy --project gymind-p --non-interactive
