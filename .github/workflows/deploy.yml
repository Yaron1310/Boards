name: Deploy

# Deploys the whole Firebase project (functions, hosting, Firestore and Storage rules) whenever
# something lands on main — normally a merged pull request. Can also be started by hand from the
# Actions tab ("Run workflow").
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never run two deploys at once; a newer merge waits for the running deploy instead of racing it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      # Must match "runtime" in firebase.json, so the build here matches what runs in production.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      # The frontend's Firebase web config (public values) comes from the committed
      # frontend/.env.production, which the frontend build reads automatically.
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # A service account key for the boards-f313e project, stored as the FIREBASE_SERVICE_ACCOUNT
      # repository secret (the whole JSON file's contents).
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Uses the project's own pinned firebase-tools (backend devDependency), so CI deploys with
      # the same CLI version as a local `npx firebase`. firebase.json's predeploy hooks build the
      # backend and the frontend (and retain the previous deploy's assets) before uploading.
      - name: Deploy
        run: ./backend/node_modules/.bin/firebase deploy --project boards-f313e --non-interactive
